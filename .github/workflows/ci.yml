name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sparky-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify content integrity and generated iOS parity
        run: bun run check:content

      - name: Run the web, PWA and content-hash gate
        run: bun run check:web

      - name: Run the native gate
        run: bun run check:native

name: Sparky

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: T29NU9NCA2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true

targets:
  Sparky:
    type: application
    platform: iOS
    sources:
      - path: Sparky
        excludes:
          - Resources/Content/README.md
      - path: ../public/exam-images
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erlinhoxha.sparky
        PRODUCT_NAME: Sparky
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Sparky
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sparky/Sparky.entitlements
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - SparkyTests
        - SparkyUITests
      gatherCoverageData: true

  SparkyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SparkyTests
    dependencies:
      - target: Sparky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erlinhoxha.sparky.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sparky.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sparky"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SparkyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SparkyUITests
    dependencies:
      - target: Sparky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erlinhoxha.sparky.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Sparky
